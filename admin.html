<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Kim Service Center</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .order-card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow-md); border-left: 8px solid var(--primary); }
        .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gray-200); padding-bottom: 10px; margin-bottom: 15px; }
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
        .status-pending { background: #fff7ed; color: #c2410c; }
        .status-verified { background: #f0fdf4; color: #15803d; }
        .order-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .image-preview { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; cursor: pointer; border: 1px solid var(--gray-200); }
        .login-screen { height: 80vh; display: flex; align-items: center; justify-content: center; }
        .control-panel { background: var(--accent); padding: 20px; border-radius: 24px; margin-bottom: 30px; }
        select { padding: 8px; border-radius: 10px; border: 1px solid var(--gray-300); outline: none; }
    </style>
</head>
<body>

<div class="admin-container">
    <header class="fade-in" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <div class="logo gradient-text">ADMIN PANEL</div>
            <div class="subtitle">KIM SERVICE CENTER</div>
        </div>
        <button id="logoutBtn" class="btn btn-outline hidden" onclick="logout()">Logout</button>
    </header>

    <div id="loginScreen" class="login-screen">
        <div class="glass-card text-center" style="width: 100%; max-width: 400px;">
            <h2 class="mb-4">Admin Login</h2>
            <button class="btn btn-primary w-100" onclick="loginWithGoogle()">Login with Google</button>
            <p class="subtitle mt-3">Authorized personnel only.</p>
        </div>
    </div>

    <div id="adminContent" class="hidden">
        <div class="control-panel slide-up">
            <h3>Website Controls</h3>
            <div class="mt-3" style="display: flex; gap: 20px; flex-wrap: wrap;">
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                    <input type="checkbox" id="privacyToggle" onchange="togglePrivacy(this.checked)"> Enable Privacy Mode
                </label>
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                    <input type="checkbox" id="maintenanceToggle" onchange="toggleMaintenance(this.checked)"> Maintenance Mode
                </label>
            </div>
        </div>

        <h2 class="mb-4">Active Orders</h2>
        <div id="ordersList">
            <!-- Orders injected here -->
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const ADMIN_EMAIL = "kimservicecenter@gmail.com"; // Replace with actual admin email

    auth.onAuthStateChanged(user => {
        if (user && user.email === ADMIN_EMAIL) {
            showAdmin();
        } else if (user) {
            alert("Unauthorized Access. This email is not authorized as admin.");
            auth.signOut();
            showLogin();
        } else {
            showLogin();
        }
    });

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
    }

    function logout() {
        auth.signOut();
    }

    function showAdmin() {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminContent').classList.remove('hidden');
        document.getElementById('logoutBtn').classList.remove('hidden');
        loadOrders();
        loadSettings();
    }

    function showLogin() {
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('adminContent').classList.add('hidden');
        document.getElementById('logoutBtn').classList.add('hidden');
    }

    async function loadSettings() {
        const doc = await db.collection('settings').doc('general').get();
        if (doc.exists) {
            const data = doc.data();
            document.getElementById('privacyToggle').checked = data.privacyMode || false;
            document.getElementById('maintenanceToggle').checked = data.maintenanceMode || false;
        }
    }

    function togglePrivacy(val) {
        db.collection('settings').doc('general').set({ privacyMode: val }, { merge: true });
    }

    function toggleMaintenance(val) {
        db.collection('settings').doc('general').set({ maintenanceMode: val }, { merge: true });
    }

    function loadOrders() {
        db.collection("orders").orderBy("timestamp", "desc").onSnapshot(snapshot => {
            const list = document.getElementById('ordersList');
            list.innerHTML = '';
            snapshot.forEach(doc => {
                const order = doc.data();
                const card = document.createElement('div');
                card.className = 'order-card fade-in';
                card.innerHTML = `
                    <div class="order-header">
                        <div>
                            <strong style="font-size: 1.2rem;" class="safe-text-service"></strong>
                            <span class="subtitle" style="margin-left: 10px;">ID: <span class="safe-text-id"></span></span>
                        </div>
                        <select onchange="updateStatus('${doc.id}', this.value)">
                            <option value="Pending Verification" ${order.status === 'Pending Verification' ? 'selected' : ''}>Pending</option>
                            <option value="Payment Verified" ${order.status === 'Payment Verified' ? 'selected' : ''}>Verified</option>
                            <option value="In Progress" ${order.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                            <option value="Completed" ${order.status === 'Completed' ? 'selected' : ''}>Completed</option>
                            <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                        </select>
                    </div>
                    <div class="order-grid">
                        <div>
                            <p class="subtitle">Customer Details</p>
                            <p><strong>Title:</strong> <span class="safe-text-title"></span></p>
                            <p><strong>TX ID:</strong> <span class="safe-text-tx"></span></p>
                            <p><strong>Method:</strong> <span class="safe-text-method"></span></p>
                            <p><strong>Price:</strong> ${order.price.toLocaleString()} Ks</p>
                        </div>
                        <div>
                            <p class="subtitle">Screenshots</p>
                            <div style="display: flex; gap: 10px;">
                                ${order.screenshotUrl ? `<img src="${order.screenshotUrl}" class="image-preview" onclick="window.open(this.src)">` : ''}
                                ${order.refImageUrl ? `<img src="${order.refImageUrl}" class="image-preview" onclick="window.open(this.src)">` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="mt-3">
                        <p class="subtitle">Description</p>
                        <p class="safe-text-desc" style="background: var(--gray-100); padding: 10px; border-radius: 10px; font-size: 0.9rem; white-space: pre-wrap;"></p>
                    </div>
                `;

                // Securely set user-provided text
                card.querySelector('.safe-text-service').textContent = order.service;
                card.querySelector('.safe-text-id').textContent = order.orderId;
                card.querySelector('.safe-text-title').textContent = order.title;
                card.querySelector('.safe-text-tx').textContent = order.transactionId;
                card.querySelector('.safe-text-method').textContent = order.paymentMethod;
                card.querySelector('.safe-text-desc').textContent = order.description;
                list.appendChild(card);
            });
        });
    }

    function updateStatus(id, newStatus) {
        db.collection("orders").doc(id).update({ status: newStatus });
    }
</script>
</body>
</html>
